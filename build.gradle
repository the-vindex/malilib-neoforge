plugins {
	id 'team.cagayakegirls.scripts'
	id 'dev.architectury.loom'
	id 'maven-publish'
}

// Audited fork (Overseer): no extra repositories; dependencies come from Mojang, NeoForge and FabricMC/Architectury
// (mappings) only, checked by gradle/verification-metadata.xml.

/*
fabricApi {
	configureDataGeneration {
		client = true
	}
}
*/

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings extraMappings.yarnWithPatch(project.mappings_version, "1.21+build.4")
//    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"
//	implementation "org.jspecify:jspecify:1.0.0"

	// Audited fork: the bundled Forgified Fabric API (base + networking) is removed; nothing here uses it.

	//modRuntimeOnly 'me.fallenbreath:mixin-auditor:0.1.0'
}

base {
	group = project.group + "." + project.mod_id
	archivesName = project.mod_file_name
	version = "${project.mod_version}+mc${project.minecraft_version_out}"

	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
    accessWidenerPath = file("src/main/resources/malilib.accesswidener")

//	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=true']
//	// [FEATURE] MIXIN_AUDITOR
//	runs {
//		def auditVmArgs = [*commonVmArgs, '-DmixinAuditor.audit=true']
//		clientMixinAudit {
//			client()
//			vmArgs auditVmArgs
//			ideConfigGenerated false
//		}
//	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version_range: libs.versions.range.game.get(),
			neoforge_version_range : libs.versions.range.neoforge.get(),
			fml_version_range      : libs.versions.range.fml.get(),
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_version            : "${project.version}",
			mod_link               : libs.versions.mod.link.get(),
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources {
	srcDir generateModMetadata
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.20.5 (24w14a) uses Java 21.
	it.options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

java {
	// Audited fork: one exact compiler for reproducible jars, whatever JDK launches Gradle (a different javac changes
	// the bytecode, and Litematica pins MaFgLib's checksum).
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
		vendor = JvmVendorSpec.ADOPTIUM
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// Audited fork: no sources jar in the forks Maven publication — its text depends on the checkout's line endings, so
	// the published Gradle module metadata (which records its hash) would not be reproducible. Litematica needs the binary.
	// withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}"}
	}
}

remapJar.atAccessWideners.add("malilib.accesswidener")

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	// The forks repo's local Maven (FORKS_MAVEN): Litematica builds against this source-built jar only.
	repositories {
		if (System.getenv("FORKS_MAVEN")) {
			maven { name = "forks"; url = System.getenv("FORKS_MAVEN") }
		}
	}
}

// Audited fork: the toolchain spec above selects vendor + major only; this pins the exact compiler build, so a different
// JDK patch release fails the build instead of silently producing other bytecode.
def pinnedCompiler = providers.gradleProperty("audited_compiler").getOrElse("21.0.13.1+2-LTS")
tasks.withType(JavaCompile).configureEach { task ->
	doFirst {
		def v = task.javaCompiler.get().metadata.javaRuntimeVersion
		if (v != pinnedCompiler) throw new GradleException("compiler " + v + " is not the pinned " + pinnedCompiler + " (audited reproducible build)")
	}
}
